name: Sync Homepage Guestbook

on:
  discussion_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  discussions: read

concurrency:
  group: homepage-guestbook-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.discussion.number == 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Discussion 2 comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          query = '''
          query HomeGuestbook($owner: String!, $repo: String!, $number: Int!) {
            repository(owner: $owner, name: $repo) {
              discussion(number: $number) {
                number
                title
                url
                comments(last: 30) {
                  totalCount
                  nodes {
                    id
                    bodyText
                    createdAt
                    updatedAt
                    url
                    author { login avatarUrl url }
                    reactions { totalCount }
                  }
                }
              }
            }
          }
          '''
          request = urllib.request.Request(
              'https://api.github.com/graphql',
              data=json.dumps({
                  'query': query,
                  'variables': {'owner': 'bluhuang', 'repo': 'blogs-of-bluhuang', 'number': 2},
              }).encode('utf-8'),
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=25) as response:
              payload = json.load(response)
          if payload.get('errors'):
              raise RuntimeError(payload['errors'])
          discussion = payload['data']['repository']['discussion']
          comments = []
          for comment in reversed(discussion['comments']['nodes'] or []):
              author = comment.get('author') or {}
              comments.append({
                  'id': comment.get('id'),
                  'bodyText': comment.get('bodyText') or '',
                  'createdAt': comment.get('createdAt'),
                  'updatedAt': comment.get('updatedAt'),
                  'url': comment.get('url'),
                  'reactionCount': (comment.get('reactions') or {}).get('totalCount', 0),
                  'author': {
                      'login': author.get('login') or 'GitHub User',
                      'avatarUrl': author.get('avatarUrl'),
                      'url': author.get('url'),
                  },
              })
          output = {
              'available': True,
              'discussionNumber': discussion['number'],
              'discussionTitle': discussion['title'],
              'discussionUrl': discussion['url'],
              'totalCount': discussion['comments']['totalCount'],
              'comments': comments[:12],
              'generatedAt': datetime.now(timezone.utc).isoformat(),
          }
          path = Path('data/home-guestbook.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(output, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Commit refreshed snapshot
        run: |
          git config user.name 'Guestbook Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/home-guestbook.json
          if git diff --cached --quiet; then
            echo 'Guestbook snapshot is already current.'
            exit 0
          fi
          git commit -m 'Sync homepage guestbook [skip ci]'
          git push origin gh-pages